[project]
name = "geminitelegrambot"
version = "0.1.0"
description = "Telegram bot with Groq AI integration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.133.0",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.41.0",
    "hammett",
    "gigachat>=0.2.1",
]

[tool.uv.sources]
hammett = { git = "https://github.com/cusdeb-com/hammett.git", rev = "release1" }

version: '3.9'

services:
  db:
    image: postgres:15-alpine
    container_name: gemini_db
    restart: always
    environment:
      POSTGRES_DB: geminiDB
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: